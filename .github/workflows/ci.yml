name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Security, Types, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        # Required native binaries are distributed as integrity-locked optional packages.
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Security regressions
        run: npm run test:security

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # CI must build without connecting to the production database.
          v5sitedb_DATABASE_URL: ""
